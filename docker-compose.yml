services:
  postgres:
    image: postgres:16-alpine
    container_name: pp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pp
      POSTGRES_PASSWORD: pp_local_dev
      POSTGRES_DB: payment_platform
    ports:
      # Not 5432/5433: a local PostgreSQL install commonly holds those and will
      # answer instead of the container, producing a confusing auth failure.
      - '55432:5432'
    volumes:
      - pp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pp -d payment_platform']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pp-pgdata:
