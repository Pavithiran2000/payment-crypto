# ============================================================================
# nginx HTTP config for payment-platform — terracottatiles.online
#
# On the server:
#   sudo cp deploy/nginx/payment-platform.conf /etc/nginx/sites-available/payment-platform
#   sudo ln -s /etc/nginx/sites-available/payment-platform /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTP only, on purpose - certbot upgrades this to HTTPS next. Every domain
# passed to certbot must already appear in a server_name below, or it fails
# with "Could not automatically find a matching server block" for whichever
# one is missing:
#   sudo certbot --nginx --redirect \
#     -d terracottatiles.online -d www.terracottatiles.online \
#     -d api.terracottatiles.online
# It rewrites the two public server{} blocks below in place (redirect to
# HTTPS + a matching 443 block per domain); the internal 8080 block is left
# untouched since it never needs TLS - it's loopback-only.
#
# Two public domains, two purposes (see docs/aws-deployment-architecture.md
# §1.6-1.8 for why the API sits on its own subdomain rather than sharing a
# path prefix with the storefront):
#   terracottatiles.online       storefront - apps/web
#   api.terracottatiles.online   public mainly so MoonPay's webhook can reach
#                                 it; also fine for direct API calls/testing
# ============================================================================

upstream pp_web {
    least_conn;
    server 127.0.0.1:3001 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3011 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

upstream pp_api {
    least_conn;
    server 127.0.0.1:3000 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:3010 max_fails=2 fail_timeout=10s;
    keepalive 32;
}

# Internal-only, loopback-bound. Gives apps/web's server-side BFF calls
# (src/lib/payment-api.ts) the same load-balancing + automatic failover
# across both API instances that public traffic gets below, instead of a
# hardcoded call to a single port that goes down mid-restart. Not reachable
# from outside this host - there is no public server_name for it and it only
# listens on 127.0.0.1.
#
# apps/web/.env.deploy's PAYMENT_API_URL must point here, not at :3000
# directly - see the comment in that file.
server {
    listen 127.0.0.1:8080;

    location / {
        proxy_pass http://pp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}

# Storefront.
server {
    listen 80;
    listen [::]:80;
    server_name terracottatiles.online www.terracottatiles.online;

    client_max_body_size 2m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://pp_web;
        proxy_read_timeout 60s;
    }
}

# API - public so MoonPay's webhook can reach it. /orders* is also here,
# guarded by ApiKeyGuard on the application side (401 without the shared
# secret), which is fine to expose publicly - useful for direct curl testing
# the way this session's sandbox debugging already relied on.
server {
    listen 80;
    listen [::]:80;
    server_name api.terracottatiles.online;

    client_max_body_size 2m;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # MoonPay wants 2xx within 5s and needs the raw bytes intact for HMAC
    # verification against req.rawBody - unbuffered so nginx doesn't hold
    # the body while deciding whether to proxy it.
    location /webhooks/ {
        proxy_pass http://pp_api;
        proxy_request_buffering off;
        proxy_read_timeout 30s;
        access_log /var/log/nginx/webhooks.log;
    }

    location / {
        proxy_pass http://pp_api;
    }
}
